name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools (Pillow, ffmpeg, Japanese fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk python3-pil
      - name: Verify (build up to date, site check, pipeline tests)
        run: bash tools/verify.sh
